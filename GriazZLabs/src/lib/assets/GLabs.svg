<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <!-- Definisi Gradasi Warna -->
  <defs>
    <linearGradient id="glabsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Bagian Ikon (Stylized G + Tech Node) -->
  <g transform="translate(15, 10)">
    <!-- Outer Hexagon Ring -->
    <path d="M40 5 L70 22.3 L70 57.7 L40 75 L10 57.7 L10 22.3 Z" fill="none" stroke="url(#glabsGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner G Shape -->
    <path d="M48 25 A 15 15 0 1 0 58 48 L 40 48" fill="none" stroke="url(#glabsGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Tech Dot -->
    <circle cx="40" cy="48" r="4.5" fill="#06B6D4" />
  </g>

  <!-- Bagian Teks "GLabs" -->
  <text x="110" y="58" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#0F172A">
    G<tspan fill="url(#glabsGrad)">Labs</tspan>
  </text>

  <!-- Slogan / Tagline Kecil -->
  <text x="112" y="78" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="4">
    INNOVATION LAB
  </text>
</svg>
